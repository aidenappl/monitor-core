name: Build and Deploy to Registry

# ─────────────────────────────────────────────────────────────────────────────
# ONE IMAGE, N ZONES.
#
# This used to be a single curl to one LATTICE_DEPLOY_URL with
# `?container=monitor-core`, which redeployed exactly one container — the
# control plane's. Zone `appleby` was therefore never redeployed by CI at all.
# On 2026-09-12 it ended up a full release and eight migrations behind, in both
# code and schema, and nothing anywhere reported it: the endpoint that would
# have said so (/version) was in the release the zone had not received.
#
# A Lattice deploy token is bound to ONE STACK, and `?container=` only narrows
# within that stack — so reaching a second zone is a second credential, not a
# second query parameter. That is why this is a matrix over a committed target
# list rather than a longer URL.
#
# ⚠️ ZONES DEPLOY BEFORE THE CONTROL PLANE. The control plane probes each zone's
# /health and reads what it reports, so a zone should already speak any new
# dialect before the plane that interprets it rolls. That ordering is the
# `needs:` on deploy-control-plane, not a convention anyone has to remember.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ⚠️ THIS IS ITS OWN JOB, AND MUST NOT GAIN A KEYRING STEP. It exists only to
  # turn a committed JSON file into two matrix expressions, which looks like it
  # belongs in build-and-push — where the first version of it lived, and failed.
  #
  # keyring-actions injects ~20 secrets and registers EVERY value with
  # ::add-mask::, including public ones (NEXT_PUBLIC_MONITOR_API_URL,
  # NEXT_PUBLIC_COOKIE_DOMAIN). One of those values appears verbatim inside a
  # `health` URL in deploy-targets.json — so GitHub saw a masked value in the
  # job output and refused to emit it:
  #
  #     ! Skip output 'zones' since it may contain secret.
  #
  # That is a WARNING, not an error. build-and-push went green, both matrices
  # resolved to nothing, neither deploy job was created, and the run failed with
  # no failing step to look at. The image shipped; nothing deployed.
  #
  # Masking is registered per-job, so the whole fix is this separation. Keep it.
  targets:
    runs-on: ubuntu-latest
    outputs:
      zones: ${{ steps.read.outputs.zones }}
      control_plane: ${{ steps.read.outputs.control_plane }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Read deploy targets
        id: read
        run: |
          ZONES=$(jq -c '[.[] | select(.role != "both" and .role != "app")]' .github/deploy-targets.json)
          PLANE=$(jq -c '[.[] | select(.role == "both" or .role == "app")]' .github/deploy-targets.json)

          # An empty matrix SKIPS its job silently, which is indistinguishable in
          # the Actions UI from a deploy that worked — the exact failure this
          # workflow was written to end. Fail loudly instead.
          if [ "$ZONES" = "[]" ] || [ -z "$ZONES" ]; then
            echo "::error title=No zone targets::deploy-targets.json produced no zone entries. An empty matrix would skip every zone deploy silently."
            exit 1
          fi
          if [ "$PLANE" = "[]" ] || [ -z "$PLANE" ]; then
            echo "::error title=No control-plane target::deploy-targets.json produced no entry with role 'both' or 'app'."
            exit 1
          fi

          echo "zones=$ZONES"         >> "$GITHUB_OUTPUT"
          echo "control_plane=$PLANE" >> "$GITHUB_OUTPUT"
          echo "zones: $ZONES"
          echo "control plane: $PLANE"

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Inject Keyring secrets
        id: keyring
        uses: aidenappl/keyring-actions@v1
        with:
          url: ${{ secrets.KEYRING_URL }}
          access-key-id: ${{ secrets.KEYRING_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KEYRING_SECRET_ACCESS_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY_URL }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the commit into the binary so GET /version can report which
          # build a container is running. This is what makes the drift above
          # detectable rather than merely regrettable.
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-zones:
    needs: [targets, build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      # One unreachable zone must not cancel the others. A half-deployed fleet
      # is the state this whole workflow exists to make visible, so the run has
      # to reach the verification step for every target it can.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.zones) }}
    steps:
      - name: Deploy ${{ matrix.target.zone }}
        id: deploy
        env:
          DEPLOY_URL: ${{ secrets[matrix.target.secret] }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            # NOT a silent skip. A zone that is in the target list but has no
            # credential is precisely the drift this workflow was written to
            # end, so it gets a warning annotation in the Actions UI and a line
            # in the run summary. It is not a failure, because the fix is to
            # mint a Lattice deploy token for that stack and add its URL as a
            # repository secret — a setup step, not a broken build.
            echo "::warning title=${{ matrix.target.zone }} not deployed::No ${{ matrix.target.secret }} secret is set, so this zone was skipped and is now behind ${{ github.sha }}. Create a Lattice deploy token for its stack and add the URL as that secret."
            echo "- ⚠️ **${{ matrix.target.zone }}** skipped — \`${{ matrix.target.secret }}\` is not set" >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sf -X POST "$DEPLOY_URL?container=${{ matrix.target.container }}&commit=${{ github.sha }}" \
            --max-time 30 -o /dev/null -w "HTTP %{http_code}\n"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # THE STEP THAT MAKES DRIFT IMPOSSIBLE TO SHIP UNNOTICED. Without it a
      # deploy that silently did nothing looks identical to one that worked —
      # which is exactly how a zone ended up eight migrations behind with a
      # green CI history above it.
      - name: Verify ${{ matrix.target.zone }} is running this commit
        if: steps.deploy.outputs.skipped == 'false'
        run: |
          for i in $(seq 1 20); do
            RUNNING=$(curl -sf --max-time 10 "${{ matrix.target.health }}/version" | jq -r '.commit // ""' || true)
            if [ "$RUNNING" = "${{ github.sha }}" ]; then
              echo "${{ matrix.target.zone }} is running ${{ github.sha }}"
              echo "- ✅ **${{ matrix.target.zone }}** on \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "[$i/20] ${{ matrix.target.zone }} reports '${RUNNING:-no /version}', waiting…"
            sleep 15
          done
          echo "::error title=${{ matrix.target.zone }} did not converge::It never reported ${{ github.sha }} on /version."
          exit 1

  deploy-control-plane:
    # Zones first — see the header. If a zone's deploy fails this still runs:
    # leaving the control plane on an older build than its zones is the safer
    # half of a bad situation, and `always()` keeps the failure attributed to
    # the zone that actually failed rather than cascading.
    needs: [targets, build-and-push, deploy-zones]
    if: always() && github.ref == 'refs/heads/main' && needs.targets.result == 'success' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.control_plane) }}
    steps:
      - name: Deploy ${{ matrix.target.zone }}
        id: deploy
        env:
          DEPLOY_URL: ${{ secrets[matrix.target.secret] }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error title=${{ matrix.target.zone }} has no deploy credential::${{ matrix.target.secret }} is not set."
            exit 1
          fi
          curl -sf -X POST "$DEPLOY_URL?container=${{ matrix.target.container }}&commit=${{ github.sha }}" \
            --max-time 30 -o /dev/null -w "HTTP %{http_code}\n"

      - name: Verify ${{ matrix.target.zone }} is running this commit
        run: |
          for i in $(seq 1 20); do
            RUNNING=$(curl -sf --max-time 10 "${{ matrix.target.health }}/version" | jq -r '.commit // ""' || true)
            if [ "$RUNNING" = "${{ github.sha }}" ]; then
              echo "${{ matrix.target.zone }} is running ${{ github.sha }}"
              echo "- ✅ **${{ matrix.target.zone }}** on \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "[$i/20] ${{ matrix.target.zone }} reports '${RUNNING:-no /version}', waiting…"
            sleep 15
          done
          echo "::error title=${{ matrix.target.zone }} did not converge::It never reported ${{ github.sha }} on /version."
          exit 1
