name: Build and Deploy to Registry

# ─────────────────────────────────────────────────────────────────────────────
# ONE IMAGE, ONE TRIGGER, EVERY ZONE.
#
# This began as a single curl to a Lattice deploy URL with
# `?container=monitor-core`. A deploy token is bound to ONE STACK, so zone
# `appleby` (another stack) was never redeployed by CI — on 2026-09-12 it was
# found a full release and eight migrations behind, with a green CI history.
#
# Now CI fires ONE Lattice automation ("Redeploy Monitor Core"), whose ordered
# steps redeploy every zone's container across stacks. Which zones exist, and
# in what order they roll, is the automation's business — adding a zone is a
# new step there, not a change here. Its webhook URL is the LATTICE_DEPLOY_URL
# secret, and nothing else in this file knows where Lattice lives.
#
# ⚠️ A GREEN RUN MEANS LATTICE ACCEPTED THE REDEPLOYS, NOT THAT THEY LANDED. A
# redeploy step succeeds when the worker accepts the command, and CI does not
# poll the zones afterwards. Each zone's GET /version reports the commit it is
# running, and the automation's run history records every firing — that is
# where to look when a deploy seems not to have taken.
#
# ⚠️ ZONES ROLL WITHIN SECONDS OF THE CONTROL PLANE. The steps run in order
# (zones first) and stop at the first one a worker refuses, but none waits for
# its container to come up.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Inject Keyring secrets
        id: keyring
        uses: aidenappl/keyring-actions@v1
        with:
          url: ${{ secrets.KEYRING_URL }}
          access-key-id: ${{ secrets.KEYRING_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KEYRING_SECRET_ACCESS_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY_URL }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the commit into the binary so GET /version can report which
          # build a container is running — the way to confirm a deploy landed.
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The automation REFUSES a firing while its previous run still holds the run
    # guard (409, recorded as skipped) rather than queueing it. Two quick pushes
    # would race; this queues the second workflow's deploy behind the first.
    concurrency:
      group: monitor-core-deploy
      cancel-in-progress: false
    steps:
      - name: Fire the Lattice automation
        env:
          DEPLOY_URL: ${{ secrets.LATTICE_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error title=No deploy credential::LATTICE_DEPLOY_URL is not set. It must hold the webhook URL of the Lattice automation that redeploys every zone."
            exit 1
          fi

          # Synchronous: Lattice runs every step before it answers, inside a 50s
          # run budget that sits under its own 60s write timeout. 75s leaves
          # room for the connection itself.
          HTTP=$(curl -sS -X POST "$DEPLOY_URL?commit=${{ github.sha }}" \
            --max-time 75 -o response.json -w '%{http_code}') || {
            echo "::error title=Lattice unreachable::The automation webhook did not answer (curl exit $?)."
            exit 1
          }

          RESULT=$(jq -r '.data.result // empty' response.json 2>/dev/null || true)
          MESSAGE=$(jq -r '[.message, .error, .error_message] | map(select(. != null and . != "")) | unique | join(" — ")' response.json 2>/dev/null || true)

          # Which step did what is the first question when a deploy looks wrong,
          # so it is printed on success too.
          jq -r '.data.run.steps[]? | "  \(.type) → \(.status): \(.summary)\(if .error then " (\(.error))" else "" end)"' response.json 2>/dev/null || true

          # ⚠️ HTTP 200 IS NOT SUCCESS. A DISABLED automation answers 200 with
          # result "disabled" and runs nothing — so this checks the verdict, not
          # the status code. Skipped (409) and failed (424) carry their reason in
          # the message.
          if [ "$HTTP" = "200" ] && [ "$RESULT" = "succeeded" ]; then
            echo "Lattice: $MESSAGE"
            echo "- 🚀 Lattice: $MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A non-JSON body is almost always the wrong URL — the automation's
          # dashboard page rather than its webhook.
          DETAIL=${MESSAGE:-"no JSON body. Check that LATTICE_DEPLOY_URL is the automation's webhook URL rather than its dashboard page."}
          echo "::error title=Automation did not succeed::HTTP $HTTP, result '${RESULT:-none}': $DETAIL"
          echo "- ❌ Lattice: HTTP $HTTP, result \`${RESULT:-none}\` — $DETAIL" >> "$GITHUB_STEP_SUMMARY"
          exit 1
