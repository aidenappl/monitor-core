version: "3.8"

services:
  monitor-web:
    image: registry.appleby.cloud/monitor-web:latest
    container_name: monitor-web
    ports:
      - "3030:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Public origin (browser SSO redirect) vs internal origin (server-side proxy
      # + SSE routes reach monitor-core over the container network, no hairpin).
      NEXT_PUBLIC_MONITOR_API_URL: "https://api.monitor.appleby.cloud"
      MONITOR_API_INTERNAL_URL: "http://monitor-core:8080"
    restart: unless-stopped
    networks:
      - monitor-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -f http://localhost:3000/api/health || exit 1"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    depends_on:
      monitor-core:
        condition: service_healthy
    labels:
      - "com.docker.compose.project=monitor-web"
      - "traefik.enable=false"
  monitor-core:
    image: registry.appleby.cloud/monitor-core:latest
    container_name: monitor-core
    ports:
      - "8030:8080"
    environment:
      HTTP_PORT: "8080"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DATABASE: "monitor"
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MONITOR_API_KEY: ${MONITOR_API_KEY}
      MON_DB_DSN: monitor:${MARIADB_PASSWORD}@tcp(monitor-mariadb:3306)/monitor_auth
      KEYRING_URL: ${KEYRING_URL}
      KEYRING_ACCESS_KEY_ID: ${KEYRING_ACCESS_KEY_ID}
      KEYRING_SECRET_ACCESS_KEY: ${KEYRING_SECRET_ACCESS_KEY}
      MON_PUBLIC_URL: "https://api.monitor.appleby.cloud"
      MON_WEB_URL: "https://monitor.appleby.cloud"
      # Hardcoded, NOT ${VAR:-default} — Lattice does not resolve the shell-style
      # ${VAR:-default} syntax (it would pass the literal through).
      BATCH_SIZE: "1000"
      FLUSH_INTERVAL: "5s"
      QUEUE_SIZE: "100000"
    restart: unless-stopped
    networks:
      - monitor-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -f http://localhost:8080/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      clickhouse:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    labels:
      - "com.docker.compose.project=monitor-core"
      - "traefik.enable=false"

  mariadb:
    image: mariadb:11.4
    container_name: monitor-mariadb
    ports:
      - "3336:3306"
    environment:
      MARIADB_DATABASE: monitor_auth
      # Literal, NOT ${MARIADB_USERNAME:-monitor}: Lattice doesn't resolve the
      # ${VAR:-default} syntax, which left MARIADB_USER empty so MariaDB created no
      # app user — every 'monitor' login then failed with access-denied.
      MARIADB_USER: monitor
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - monitor-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "healthcheck.sh --connect --innodb_initialized || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.docker.compose.project=monitor-core"
      - "traefik.enable=false"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: monitor-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    restart: unless-stopped
    networks:
      - monitor-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "clickhouse-client --query 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.docker.compose.project=monitor-core"
      - "traefik.enable=false"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

networks:
  monitor-network:
    driver: bridge

volumes:
  clickhouse-data:
  clickhouse-logs:
  mariadb-data:
